name: Fix sync Clippy findings

on:
  push:
    branches:
      - feat/clipmo-cross-device-sync-complete
    paths:
      - .github/workflows/fix-sync-clippy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clipmo-cross-device-sync-complete
          fetch-depth: 0

      - name: Apply strict Clippy fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src-tauri/src/sync.rs')
          text = path.read_text()

          text, edits = re.subn(
              r'''                    if before\.content_hash != row\.content_hash \|\| before\.content != row\.content \{\n                        if !consume_edit_suppression\(&service, id_hash, &row\.content_hash\) \{\n                            service\.enqueue_edit\(row\);\n                        \}\n                    \}\n''',
              '''                    if (before.content_hash != row.content_hash || before.content != row.content)\n                        && !consume_edit_suppression(&service, id_hash, &row.content_hash)\n                    {\n                        service.enqueue_edit(row);\n                    }\n''',
              text,
          )
          text, favorites = re.subn(
              r'''                    if before\.favorite != row\.favorite \{\n                        if !consume_favorite_suppression\(&service, id_hash, row\.favorite\) \{\n                            service\.enqueue_favorite\(row\);\n                        \}\n                    \}\n''',
              '''                    if before.favorite != row.favorite\n                        && !consume_favorite_suppression(&service, id_hash, row.favorite)\n                    {\n                        service.enqueue_favorite(row);\n                    }\n''',
              text,
          )
          text, assets = re.subn(
              r'''                    if before\.assets_fingerprint != row\.assets_fingerprint\n                        && row\.kind == ItemKind::Files\n                    \{\n                        if !consume_asset_suppression\(&service, id_hash\) \{\n                            if let Some\(db\) = &service\.db \{\n                                if let Ok\(Some\(item\)\) = db\.get\(row\.item_id\) \{\n                                    service\.enqueue_item\(&item\);\n                                \}\n                            \}\n                        \}\n                    \}\n''',
              '''                    if before.assets_fingerprint != row.assets_fingerprint\n                        && row.kind == ItemKind::Files\n                        && !consume_asset_suppression(&service, id_hash)\n                    {\n                        if let Some(db) = &service.db {\n                            if let Ok(Some(item)) = db.get(row.item_id) {\n                                service.enqueue_item(&item);\n                            }\n                        }\n                    }\n''',
              text,
          )
          if (edits, favorites, assets) != (1, 1, 1):
              raise SystemExit(f'unexpected replacement counts: {(edits, favorites, assets)}')
          path.write_text(text)
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-sync-clippy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sync): satisfy strict Clippy checks"
          git push origin HEAD:feat/clipmo-cross-device-sync-complete
