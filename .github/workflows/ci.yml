name: Windows CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A branch push and the matching pull-request synchronize event must share
  # one group, otherwise the same expensive Windows release build runs twice.
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  validate-and-bundle:
    name: Validate and bundle Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Install frontend dependencies
        run: npm ci --no-audit

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          -D warnings

      - name: Run Rust tests on Windows MSVC
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          --test-threads=1

      - name: Build NSIS installer
        run: >-
          npx tauri build
          --ci
          --target ${{ env.WINDOWS_TARGET }}
          --bundles nsis

      - name: Smoke-test packaged executable
        shell: pwsh
        run: >-
          ./scripts/smoke-test-windows.ps1
          -Executable "src-tauri/target/${{ env.WINDOWS_TARGET }}/release/clipdeck.exe"

      - name: Collect and verify artifacts
        id: collect
        shell: pwsh
        run: >-
          ./scripts/collect-windows-artifacts.ps1
          -TargetTriple "${{ env.WINDOWS_TARGET }}"
          -OutputDirectory "artifacts/windows-x64"

      - name: Upload tested Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: clipdeck-windows-x64-${{ steps.collect.outputs.version }}-${{ github.sha }}
          path: artifacts/windows-x64/
          if-no-files-found: error
          retention-days: 14
