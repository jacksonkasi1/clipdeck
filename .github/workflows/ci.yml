name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  validate-and-bundle:
    name: Validate and bundle Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.WINDOWS_TARGET }}
          cache-targets: true
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --no-audit

      # Tauri runs npm run build once via build.beforeBuildCommand. Keeping the
      # command in tauri.conf.json preserves local `tauri build` behavior.
      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          -D warnings

      - name: Run Rust tests on Windows MSVC
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          --test-threads=1

      - name: Build NSIS installer
        run: >-
          npx tauri build
          --ci
          --target ${{ env.WINDOWS_TARGET }}
          --bundles nsis

      - name: Build, extract, and smoke-test exact release assets
        id: collect
        shell: pwsh
        run: >-
          ./scripts/collect-windows-artifacts.ps1
          -TargetTriple "${{ env.WINDOWS_TARGET }}"
          -OutputDirectory "artifacts/windows-x64"

      - name: Upload the tested installer and startup screenshots
        uses: actions/upload-artifact@v7
        with:
          name: clipdeck-windows-x64-${{ steps.collect.outputs.version }}-${{ github.sha }}
          path: |
            artifacts/windows-x64/${{ steps.collect.outputs.installer }}
            artifacts/windows-x64/${{ steps.collect.outputs.main_screenshot }}
            artifacts/windows-x64/${{ steps.collect.outputs.quick_screenshot }}
          if-no-files-found: error
          retention-days: 14
