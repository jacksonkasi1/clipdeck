name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.0"
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  validate-and-bundle:
    name: Validate and bundle Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.WINDOWS_TARGET }}
          cache-targets: true
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --no-audit

      - name: Test frontend
        run: npm test

      - name: Build and type-check frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          -D warnings

      - name: Run Rust tests on Windows MSVC
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          --test-threads=1

      - name: Prepare Windows code signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Build NSIS installer
        shell: pwsh
        env:
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          $arguments = @(
            'tauri', 'build',
            '--ci',
            '--target', '${{ env.WINDOWS_TARGET }}',
            '--bundles', 'nsis'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CONFIG)) {
            $arguments += @('--config', $env:SIGNING_CONFIG)
          }
          & npx @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode signatures
        shell: pwsh
        run: >-
          ./scripts/verify-windows-signing.ps1
          -TargetTriple "${{ env.WINDOWS_TARGET }}"
          -ExpectedSigned "${{ steps.signing.outputs.enabled }}"

      - name: Build, extract, and smoke-test exact release assets
        id: collect
        shell: pwsh
        run: >-
          ./scripts/collect-windows-artifacts.ps1
          -TargetTriple "${{ env.WINDOWS_TARGET }}"
          -OutputDirectory "artifacts/windows-x64"

      - name: Reject the quick-window white frame
        shell: pwsh
        run: >-
          ./scripts/assert-quick-window-frame.ps1
          -Screenshot "artifacts/windows-x64/${{ steps.collect.outputs.quick_screenshot }}"

      - name: Upload the tested installer and startup screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clipmo-windows-x64-${{ github.sha }}
          path: |
            artifacts/windows-x64/Clipmo_*_x64-setup.exe
            artifacts/windows-x64/Clipmo_*_main-startup.png
            artifacts/windows-x64/Clipmo_*_quick-startup.png
          if-no-files-found: warn
          retention-days: 14
