name: Format cross-device sync

on:
  push:
    branches:
      - feat/clipmo-cross-device-sync-complete
    paths:
      - .github/workflows/format-cross-device-sync.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clipmo-cross-device-sync-complete
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatting
        shell: bash
        run: |
          rm .github/workflows/format-cross-device-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(sync): format cross-device implementation"
          git push origin HEAD:feat/clipmo-cross-device-sync-complete
