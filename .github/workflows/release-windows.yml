name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Build and verify Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.collect.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Install frontend dependencies
        run: npm ci --no-audit

      - name: Validate release scripts and version files
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw "$($script.Name): $($errors -join '; ')" }
          }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (cargo metadata --format-version 1 --no-deps --locked --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json).packages.Where({$_.name -eq 'clipdeck'}).version
          if (($packageVersion, $tauriVersion, $cargoVersion | Select-Object -Unique).Count -ne 1) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          -D warnings

      - name: Run Rust tests on Windows MSVC
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          --test-threads=1

      - name: Build NSIS installer
        run: >-
          npx tauri build
          --ci
          --target ${{ env.WINDOWS_TARGET }}
          --bundles nsis

      - name: Build, extract, and smoke-test exact release assets
        id: collect
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $expectedVersion = if ($env:RELEASE_REF_TYPE -eq "tag") {
            $env:RELEASE_REF_NAME -replace '^v', ''
          } else {
            ""
          }

          ./scripts/collect-windows-artifacts.ps1 `
            -TargetTriple "${{ env.WINDOWS_TARGET }}" `
            -OutputDirectory "artifacts/windows-x64" `
            -ExpectedVersion $expectedVersion

      - name: Upload only the verified installer and portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: clipdeck-windows-x64-${{ steps.collect.outputs.version }}
          path: |
            artifacts/windows-x64/${{ steps.collect.outputs.installer }}
            artifacts/windows-x64/${{ steps.collect.outputs.portable }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: clipdeck-windows-x64-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create or update GitHub release with only the two distribution assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          installer="release-assets/Clipdeck_${RELEASE_VERSION}_x64-setup.exe"
          portable="release-assets/Clipdeck_${RELEASE_VERSION}_portable_x64.zip"
          test -s "$installer" && test -s "$portable"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun may repair this tag, but it may never retain stale/raw assets.
            while IFS= read -r asset; do
              case "$asset" in
                "$(basename "$installer")"|"$(basename "$portable")") ;;
                *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY" ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")
            gh release upload "$RELEASE_TAG" "$installer" "$portable" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$installer" "$portable" \
              --verify-tag \
              --generate-notes \
              --title "Clipdeck $RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY"
          fi
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' --repo "$GITHUB_REPOSITORY")" -eq 2
