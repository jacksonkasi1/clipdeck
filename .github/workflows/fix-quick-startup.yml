name: Fix quick-window startup recovery

on:
  push:
    branches:
      - feat/clipmo-cross-device-sync-complete
    paths:
      - .github/workflows/fix-quick-startup.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clipmo-cross-device-sync-complete
          fetch-depth: 0

      - name: Apply startup recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/store.ts')
          text = path.read_text()
          start_marker = "  const listenerFailure = listenerResults.find("
          end_marker = "  window.addEventListener('focus', () => void syncAppearance());"
          start = text.index(start_marker)
          end = text.index(end_marker)
          replacement = '''  const listenerFailure = listenerResults.find(
    (result): result is PromiseRejectedResult => result.status === 'rejected',
  );
  if (listenerFailure) {
    console.error('One or more native event listeners could not be installed', listenerFailure.reason);
  }

  const syncAppearance = async () => {
    try {
      const appearance = await api.syncNativeAppearance();
      useStore.getState().applyAppearance(appearance);
    } catch (error) {
      console.error('Failed to read system appearance', error);
    }
  };

  const loadHistoryWithRetry = async () => {
    const attempts = 5;
    let lastError: unknown;
    for (let attempt = 0; attempt < attempts; attempt += 1) {
      try {
        await useStore.getState().refresh();
        return;
      } catch (error) {
        lastError = error;
        if (attempt + 1 < attempts) {
          await new Promise<void>((resolve) => {
            window.setTimeout(resolve, 120 * (2 ** attempt));
          });
        }
      }
    }
    throw lastError;
  };

  // A hidden warm quick webview can mount a fraction earlier than native state
  // is available. Retry only the history request, keep optional settings/sync
  // failures non-blocking, and signal readiness after the final list state is
  // known so smoke screenshots never capture a transient startup error.
  const loadResults = await Promise.allSettled([
    loadHistoryWithRetry(),
    useStore.getState().loadSettings(),
    useStore.getState().loadSyncState(),
    syncAppearance(),
  ]);
  const historyFailure = loadResults[0].status === 'rejected' ? loadResults[0] : null;
  for (const [index, result] of loadResults.entries()) {
    if (index > 0 && result.status === 'rejected') {
      console.error('An optional startup service could not be loaded', result.reason);
    }
  }
  useStore.setState({
    bootstrapped: true,
    bootError: historyFailure ? String(historyFailure.reason) : null,
    loading: false,
  });
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-quick-startup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(startup): retry quick-window history before readiness"
          git push origin HEAD:feat/clipmo-cross-device-sync-complete
